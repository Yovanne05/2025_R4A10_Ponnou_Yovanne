<article class="avis">
    <img class="avis-image" [src]="currentAvis.imageUrl" [alt]="currentAvis.name" />
    <section class = "avis-text">
        <h3 class="avis-name">{{ currentAvis.name }}</h3>
        <p class="avis-role">{{ currentAvis.role }}</p>
    </section>
    <p class="avis-description">{{ currentAvis.description }}</p>
</article>
